# Cloud Build: build images for api / extractor / frontend, push to
# Artifact Registry, and redeploy all three Cloud Run services.
#
# Manual run:  gcloud builds submit --config cloudbuild.yaml .

substitutions:
  _REGION: europe-west2
  _AR: europe-west2-docker.pkg.dev/esat-exam-builder/esat
  _SERVICE_ACCOUNT: esat-sa@esat-exam-builder.iam.gserviceaccount.com
  _BUCKET: esat-exam-builder-storage
  _CLOUD_SQL_INSTANCE: esat-exam-builder:europe-west2:esat-db
  # OAuth client reused from caie-exam-builder (project number 788088356796).
  # Both projects share the same Google OAuth consent screen + client ID.
  _OAUTH_CLIENT_ID: 788088356796-p4n2pal8enscnc98h1fk1e5tf7mbapmq.apps.googleusercontent.com
  # Stable Cloud Run URLs (Cloud Run v2 derives the suffix from project +
  # region, so these don't change across redeploys).
  _PUBLIC_URL: https://esat-api-6xudjnmxra-nw.a.run.app
  _FRONTEND_URL: https://esat-frontend-6xudjnmxra-nw.a.run.app
  # The first-time-signup allowlist used to live here; it's now in the DB
  # (allowed_emails table, managed via the /admin page). The repo no
  # longer ships a staff roster.

steps:
  # ---- build extractor ----
  - id: build-extractor
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_AR}/extractor:${BUILD_ID}
      - --tag=${_AR}/extractor:latest
      - --file=extractor/Dockerfile
      - extractor

  # ---- build api ----
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_AR}/api:${BUILD_ID}
      - --tag=${_AR}/api:latest
      - --file=api/Dockerfile
      - .

  # ---- push extractor + api so deploy steps can pull the tagged images ----
  - id: push-extractor
    name: gcr.io/cloud-builders/docker
    waitFor: [build-extractor]
    args: [push, --all-tags, '${_AR}/extractor']
  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args: [push, --all-tags, '${_AR}/api']

  # ---- deploy extractor (api needs its URL before it can boot) ----
  - id: deploy-extractor
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-extractor]
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy esat-extractor \
          --image=${_AR}/extractor:${BUILD_ID} \
          --region=${_REGION} \
          --service-account=${_SERVICE_ACCOUNT} \
          --no-allow-unauthenticated \
          --min-instances=0 \
          --max-instances=3 \
          --memory=1Gi \
          --cpu=1 \
          --timeout=600 \
          --set-env-vars=STORAGE_BACKEND=gcs,STORAGE_BUCKET=${_BUCKET},GOOGLE_CLOUD_PROJECT=esat-exam-builder
        # Allow only the API service account to invoke the extractor — keeps
        # it off the public internet without going through IAP.
        gcloud run services add-iam-policy-binding esat-extractor \
          --region=${_REGION} \
          --member=serviceAccount:${_SERVICE_ACCOUNT} \
          --role=roles/run.invoker

  # ---- deploy api ----
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-api, deploy-extractor]
    entrypoint: bash
    args:
      - -c
      - |
        EXTRACTOR_URL=$(gcloud run services describe esat-extractor \
          --region=${_REGION} --format='value(status.url)')
        gcloud run deploy esat-api \
          --image=${_AR}/api:${BUILD_ID} \
          --region=${_REGION} \
          --service-account=${_SERVICE_ACCOUNT} \
          --allow-unauthenticated \
          --min-instances=0 \
          --max-instances=5 \
          --memory=1Gi \
          --cpu=1 \
          --timeout=900 \
          --set-env-vars="^|^NODE_ENV=production|STORAGE_BACKEND=gcs|STORAGE_BUCKET=${_BUCKET}|GOOGLE_CLOUD_PROJECT=esat-exam-builder|GEMINI_LOCATION=us-central1|GEMINI_MODEL=gemini-2.5-flash|EXTRACTOR_URL=$$EXTRACTOR_URL|COOKIE_SECURE=true|AUTH_DISABLED=false|ADMIN_USER_UUID=00000000-0000-0000-0000-000000000001|GOOGLE_OAUTH_CLIENT_ID=${_OAUTH_CLIENT_ID}|PUBLIC_URL=${_PUBLIC_URL}|FRONTEND_URL=${_FRONTEND_URL}" \
          --set-secrets="DATABASE_URL=esat-database-url:latest,GOOGLE_OAUTH_CLIENT_SECRET=google-oauth-client-secret:latest" \
          --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}

  # ---- write the deployed API URL to /workspace so the frontend build
  #      step (which has docker but no gcloud) can read it ----
  - id: capture-api-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [deploy-api]
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe esat-api --region=${_REGION} \
          --format='value(status.url)' > /workspace/api_url

  # ---- build frontend with the deployed API URL baked in ----
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: [capture-api-url]
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(cat /workspace/api_url)
        docker build \
          --build-arg=VITE_API_URL=$$API_URL \
          --tag=${_AR}/frontend:${BUILD_ID} \
          --tag=${_AR}/frontend:latest \
          --file=frontend/Dockerfile \
          .

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: [build-frontend]
    args: [push, --all-tags, '${_AR}/frontend']

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-frontend]
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy esat-frontend \
          --image=${_AR}/frontend:${BUILD_ID} \
          --region=${_REGION} \
          --allow-unauthenticated \
          --min-instances=0 \
          --max-instances=3 \
          --memory=256Mi \
          --cpu=1 \
          --port=8080

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 2400s

images:
  - '${_AR}/api:${BUILD_ID}'
  - '${_AR}/api:latest'
  - '${_AR}/extractor:${BUILD_ID}'
  - '${_AR}/extractor:latest'
  - '${_AR}/frontend:${BUILD_ID}'
  - '${_AR}/frontend:latest'
