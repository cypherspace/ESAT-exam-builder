name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node — typecheck (api + frontend + shared-types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm --workspace packages/shared-types run lint
      - run: npm --workspace api run lint
      - run: npm --workspace frontend run lint

  python:
    name: Python — import-check extractor pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extractor deps
        working-directory: extractor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke-check pipeline imports
        working-directory: extractor
        run: |
          python -c "import app"
          python -c "from pipeline import markers, mcq_clipper, ms_parser, storage, models"
