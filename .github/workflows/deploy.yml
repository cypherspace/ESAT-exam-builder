name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required to mint a Workload Identity Federation token

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/994104992408/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: deploy-sa@esat-exam-builder.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: esat-exam-builder

      - name: Submit Cloud Build
        run: |
          gcloud builds submit --config=cloudbuild.yaml --project=esat-exam-builder .
