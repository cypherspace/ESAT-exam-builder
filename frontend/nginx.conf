server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA — always fall back to index.html for unknown routes (React Router
  # client-side paths like /builder, /library, /edit/:id, etc.).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed Vite assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
